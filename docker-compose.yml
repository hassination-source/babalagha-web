# Single-server setup: app + PostgreSQL + persistent uploads. See docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: babalagha
      POSTGRES_USER: babalagha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://babalagha:${POSTGRES_PASSWORD}@db:5432/babalagha
      DIRECT_URL: postgresql://babalagha:${POSTGRES_PASSWORD}@db:5432/babalagha
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SITE_URL: ${SITE_URL:-https://www.babalagha.com}
      STORAGE_DRIVER: local
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  pgdata:
  uploads:
